<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="icon-bg" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3a2e28"/>
      <stop offset="100%" stop-color="#1e1a18"/>
    </radialGradient>
    <radialGradient id="icon-ember" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f7b97a"/>
      <stop offset="40%" stop-color="#D65A1F"/>
      <stop offset="100%" stop-color="#7a2408"/>
    </radialGradient>
    <filter id="icon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="icon-dot-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full-bleed background (maskable safe zone: center 80%) -->
  <rect width="192" height="192" fill="url(#icon-bg)"/>
  <!-- C arc: center (90,96), radius 48, ~70° opening to the right (3× favicon) -->
  <path d="M 129,69 A 48,48 0 1 0 129,123"
        stroke="#D65A1F" stroke-width="18" stroke-linecap="round" fill="none"
        filter="url(#icon-glow)"/>
  <!-- Punto Brasa — ember dot inside C opening -->
  <circle cx="120" cy="96" r="12" fill="url(#icon-ember)" filter="url(#icon-dot-glow)"/>
</svg>
